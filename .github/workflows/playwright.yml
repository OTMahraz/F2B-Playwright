l dependencies          cache: 'npm'          node-version: ${{ matrix.node-version }}        with:        uses: actions/setup-node@v4      - name: 📦 Setup Node.js        uses: actions/checkout@v4      - name: 📥 Checkout code    steps:        browser: [chromium, firefox, webkit]        node-version: [18.x, 20.x]      matrix:      fail-fast: false    strategy:    runs-on: ubuntu-latest    timeout-minutes: 60  test:jobs:    - cron: '0 2 * * *'  # Chaque jour à 2h du matin  schedule:    branches: [main, develop]  pull_request:    branches: [main, develop, staging]  push:on:
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Exécuter les tests tous les jours à 9h du matin
    - cron: '0 9 * * *'

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    
    steps:
      # Checkout du code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configuration de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # Installation des navigateurs Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Exécution des tests (avec sharding)
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NODE_ENV: testing
          ENVIRONMENT: staging
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          HEADLESS: true
          CI: true

      # Upload des rapports HTML
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

      # Upload des résultats Allure
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 30

      # Upload des test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 30

  # Job optionnel pour générer un rapport Allure
  allure-report:
    name: Generate Allure Report
    if: always()
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find artifacts -type f -name "*.json" -o -name "*.txt" | xargs -I {} cp {} allure-results/

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report

  # Job de notification des résultats
  notify:
    name: Notify Results
    if: always()
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed!"
            exit 1
          fi

  # Job de test smoke seulement (rapide)
  smoke-tests:
    name: Smoke Tests (Quick Check)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          NODE_ENV: testing
          ENVIRONMENT: staging

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-artifacts
          path: |
            playwright-report/
            test-results/
